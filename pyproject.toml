[project]
name = "ell-ai"
version = "0.0.17"
description = "ell - the language model programming library"
authors = [{ name = "William Guss", email = "will@lrsys.xyz" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "dill",
    "colorama",
    "cattrs",
    "openai>=1.51.0",
    "requests",
    "typing-extensions",
    "black",
    "pillow>=10.4.0",
    "psutil",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.2"]
google = ["google-genai>=1.2.0,<2"]
groq = ["groq>=0.11.0"]
sqlite = ["sqlmodel>=0.0.21,<0.1.0", "alembic>=1.14.0,<2"]
postgres = ["sqlmodel>=0.0.21,<0.1.0", "psycopg2>=2.7", "alembic>=1.14.0,<2"]
studio = [
    "fastapi>=0.111.1,<0.112.0",
    "uvicorn>=0.30.3,<0.31.0",
    "sqlmodel>=0.0.21,<0.1.0",
    "alembic>=1.14.0,<2",
]
all = [
    "anthropic>=0.34.2",
    "groq>=0.11.0",
    "google-genai>=1.2.0,<2",
    "sqlmodel>=0.0.21,<0.1.0",
    "fastapi>=0.111.1,<0.112.0",
    "uvicorn>=0.30.3,<0.31.0",
    "alembic>=1.14.0,<2",
]

[project.urls]
Homepage = "https://docs.ell.so"
Repository = "https://github.com/MadcowD/ell"

[project.scripts]
ell-studio = "ell.studio.__main__:main"

[dependency-groups]
dev = ["pytest", "sphinx", "sphinx-rtd-theme"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src"]
artifacts = ["src/ell/studio/static", "src/ell/util/char_bitmaps.npy"]

[tool.hatch.build.targets.wheel]
packages = ["src/ell"]
artifacts = ["src/ell/studio/static", "src/ell/util/char_bitmaps.npy"]
