[project]
name = "ell-ai"
version = "0.0.17"
description = "ell - the language model programming library"
authors = [{ name = "William Guss", email = "will@lrsys.xyz" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "black>=26.5.1",
    "cattrs>=26.1.0",
    "colorama>=0.4.6",
    "dill>=0.4.1",
    "numpy>=2.5.2",
    "openai>=3.6.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.2.0"]
google = ["google-genai>=2.20.0,<3"]
groq = ["groq>=1.7.0"]
sqlite = ["alembic>=1.19.1,<2", "sqlmodel>=0.0.42,<0.1.0"]
postgres = ["alembic>=1.19.1,<2", "psycopg2>=2.9.12", "sqlmodel>=0.0.42,<0.1.0"]
studio = [
    "alembic>=1.19.1,<2",
    "fastapi>=0.141.1,<0.142.0",
    "sqlmodel>=0.0.42,<0.1.0",
    "uvicorn>=0.52.4,<0.53.0",
]
all = [
    "alembic>=1.19.1,<2",
    "anthropic>=1.2.0",
    "fastapi>=0.141.1,<0.142.0",
    "google-genai>=2.20.0,<3",
    "groq>=1.7.0",
    "sqlmodel>=0.0.42,<0.1.0",
    "uvicorn>=0.52.4,<0.53.0",
]

[project.urls]
Homepage = "https://docs.ell.so"
Repository = "https://github.com/MadcowD/ell"

[project.scripts]
ell-studio = "ell.studio.__main__:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]
docs = [
    "autodoc-pydantic==2.2.0",
    "myst-parser==2.0.0",
    "pydata-sphinx-theme==0.15.2",
    "sphinx==7.2.6",
    "sphinx-autodoc-typehints==1.25.2",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.5.0",
    "sphinx-inline-tabs==2023.4.21",
    "sphinx-togglebutton==0.3.2",
    "sphinxawesome-theme==5.2.0",
    "sphinxcontrib-mermaid==0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src"]
artifacts = ["src/ell/studio/static", "src/ell/util/char_bitmaps.npy"]

[tool.hatch.build.targets.wheel]
packages = ["src/ell"]
artifacts = ["src/ell/studio/static", "src/ell/util/char_bitmaps.npy"]
